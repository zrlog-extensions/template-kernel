name: Kernel theme
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  theme:
    uses: zrlog-extensions/templates/.github/workflows/theme-release.yml@fa397df332576b9dd798ac59a40d4ba96b3266a7
    with:
      toolkit-ref: fa397df332576b9dd798ac59a40d4ba96b3266a7
      publish: ${{ startsWith(github.ref, 'refs/tags/v') }}
